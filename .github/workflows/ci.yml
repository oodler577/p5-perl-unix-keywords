name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Perl ${{ matrix.perl }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            perl: '5.10'
          - os: ubuntu-latest
            perl: '5.40'
          - os: ubuntu-latest
            perl: '5.42'
          - os: windows-latest
            perl: '5.32'
          - os: windows-latest
            perl: '5.40'
          - os: windows-latest
            perl: '5.42'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Environment
        run: |
          perl -V
          perl -MConfig -e 'print "os=$^O\nmake=$Config{make}\ncc=$Config{cc}\n"'

      - name: Verify native Windows Perl
        if: runner.os == 'Windows'
        run: perl -e 'die "Windows CI is not using native MSWin32 Perl\n" unless $^O eq "MSWin32"'

      - name: Install test dependencies
        run: cpanm --notest Test::More File::Temp File::Path

      - name: Install Windows runtime dependency
        if: runner.os == 'Windows'
        run: cpanm --notest Win32::ShellQuote

      - name: Test source tree verbosely
        run: prove -lrv t
